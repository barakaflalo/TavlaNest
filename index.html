<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15120E">
<meta name="description" content="שש-בש ודמקה — מול המחשב, שניים בטלפון אחד, ואונליין עם חבר כולל קול. AppNest.">
<meta property="og:title" content="TavlaNest · שש-בש ודמקה">
<meta property="og:description" content="שש-בש ודמקה מול המחשב, בטלפון אחד או אונליין עם חבר — עם לחץ-ודבר והודעות קוליות.">
<meta property="og:image" content="icon-512.png">
<title>TavlaNest · שש-בש ודמקה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --font-d:"Secular One","Assistant","Arial Hebrew",system-ui,sans-serif;
  --font-b:"Assistant","Segoe UI","Arial Hebrew",system-ui,sans-serif;
  /* chrome (night) */
  --bg:#15120E; --surface:#1F1A14; --surface2:#2A231B; --line:#3B3226; --ink:#F2E9D8; --muted:#A99A80; --accent:#C9A44C; --accent-ink:#15120E; --danger:#D0634B; --ok:#7FB069;
  /* board materials (theme "גולד") */
  --frame:#0E0C09; --frame-hi:#C9A44C; --field:#2A231A; --ptA:#B4904A; --ptB:#E6DAC2; --bar:#0E0C09; --tray:#141109;
  --chkA:#F3EBDC; --chkA-rim:#C9A44C; --chkA-ink:#3A2E1C; --chkB:#0A0806; --chkB-rim:#C9A44C; --chkB-ink:#E9DCC0;
  --sqL:#E6DAC2; --sqD:#3A3024; --hl:#F5C451; --hl2:#7FD1B9;
  --die:#F7F1E4; --die-pip:#1B1712;
  --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-mode="day"]{--bg:#EFE9DD; --surface:#FBF8F1; --surface2:#F2ECDF; --line:#D9CDB6; --ink:#211B13; --muted:#6E6150; --accent-ink:#FFF8EA}
:root[data-theme="olive"]{--accent:#B5874A; --frame:#4E3219; --frame-hi:#E8D7AE; --field:#C8A56E; --ptA:#6B4226; --ptB:#F0E2C0; --bar:#4E3219; --tray:#3F2814;
  --chkA:#F6EEDC; --chkA-rim:#B9A37A; --chkA-ink:#5A3E22; --chkB:#4A2C17; --chkB-rim:#2B190C; --chkB-ink:#F0E2C0; --sqL:#E9D3A4; --sqD:#7A4E2A}
:root[data-theme="cafe"]{--accent:#C98F55; --frame:#3A2416; --frame-hi:#C98F55; --field:#24513D; --ptA:#E7DCC4; --ptB:#8C2F27; --bar:#3A2416; --tray:#2C1B10;
  --chkA:#F2E8D5; --chkA-rim:#A88F6A; --chkA-ink:#4A3420; --chkB:#7E2219; --chkB-rim:#4C120C; --chkB-ink:#F2E8D5; --sqL:#E7DCC4; --sqD:#24513D}
:root[data-theme="beach"]{--accent:#2E8A88; --accent-ink:#FFFFFF; --frame:#8A6E4B; --frame-hi:#F4E9D1; --field:#E8D8B4; --ptA:#2E8A88; --ptB:#E07B5C; --bar:#8A6E4B; --tray:#715839;
  --chkA:#FFFFFF; --chkA-rim:#9FB7B5; --chkA-ink:#2E5E5C; --chkB:#1F4E5F; --chkB-rim:#123240; --chkB-ink:#F4E9D1; --sqL:#F1E4C6; --sqD:#2E8A88}
:root[data-theme="night"]{--accent:#AFC3E6; --accent-ink:#0F1626; --frame:#0E1424; --frame-hi:#AFC3E6; --field:#17213A; --ptA:#5E77A8; --ptB:#C9D4EA; --bar:#0E1424; --tray:#0B101D;
  --chkA:#EEF2FA; --chkA-rim:#8FA4CC; --chkA-ink:#24365C; --chkB:#B0464F; --chkB-rim:#6E222A; --chkB-ink:#FFFFFF; --sqL:#C9D4EA; --sqD:#24345A}
:root[data-mode="night"][data-theme="night"]{--bg:#0F1320; --surface:#171C2C; --surface2:#1F2638; --line:#2E3750; --ink:#E9EEF8; --muted:#9AA6BF}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;overscroll-behavior:none}
button{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--font-d);font-weight:400;margin:0;line-height:1.15}
.screen{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-y:auto;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
.screen>.wrap{width:100%;max-width:560px;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px}
.screen.enter{animation:scrIn .22s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;touch-action:manipulation;user-select:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);background:var(--surface)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex:0 0 auto}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.topbar{display:flex;align-items:center;gap:8px;min-height:52px}
.topbar h2{font-size:22px;flex:1;text-align:center}
.back{min-height:44px;padding:6px 14px;font-size:17px}

/* home */
.brand{text-align:center;padding-top:4px}
.brand h1{font-size:40px;letter-spacing:.5px}
.brand .sub{font-size:17px;color:var(--muted);margin-top:4px}
.case{width:100%;max-width:420px;margin:0 auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1.5px solid var(--accent);background:var(--surface);border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:150px}
.tile svg{width:96px;height:72px}
.tile b{font-family:var(--font-d);font-weight:400;font-size:24px}
.tile span{font-size:14px;color:var(--muted)}
.footnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.footnav button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:2px;cursor:pointer}
.footnav button i{font-style:normal;font-size:20px}
.badge{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.badge a{color:var(--accent)}
.resume{display:flex;align-items:center;gap:12px;border-color:var(--accent)}
.resume .grow b{display:block;font-size:17px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;border-top:2px solid var(--accent);padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet h3{font-size:22px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.lbl{font-weight:700;font-size:15px;margin-bottom:-4px}
.field{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px 12px;font:inherit;font-size:17px}
.code{font-family:var(--font-d);font-size:44px;letter-spacing:8px;text-align:center;direction:ltr}

/* game screen */
#game .wrap{gap:8px;padding-top:6px}
.strip{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:54px;position:relative}
.strip.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.strip .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid}
.strip .nm{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .meta{font-size:14px;color:var(--muted);white-space:nowrap}
.strip .score{font-family:var(--font-d);font-size:22px;min-width:24px;text-align:center}
.strip .net{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.strip .net.on{background:var(--ok)}
.strip .talkbadge{font-size:13px;color:var(--ok);font-weight:700}
.boardbox{position:relative;width:100%;touch-action:none;user-select:none}
.boardbox svg{display:block;width:100%;height:auto}
.msg{min-height:26px;text-align:center;font-weight:600;font-size:16px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.actions .btn{flex:1 1 0;min-width:0;padding:10px 8px}
.floatemo{position:absolute;font-size:42px;pointer-events:none;animation:emo 1.8s ease-out forwards;z-index:5}
@keyframes emo{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.dragGhost{position:fixed;pointer-events:none;z-index:60;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-80%);box-shadow:0 8px 16px rgba(0,0,0,.4)}

/* online dock */
.dock{display:flex;gap:8px;align-items:stretch}
.dock .iconbtn{width:52px;height:56px;font-size:24px}
.ptt{flex:1;min-height:56px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.ptt.on{background:var(--ok);border-color:var(--ok);color:#10140C}
.iconbtn.on{background:var(--ok);border-color:var(--ok)}
.iconbtn.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.emopop{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.emopop button{font-size:30px;width:54px;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.vmsg{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px;cursor:pointer}
.netbar{font-size:14px;text-align:center;padding:6px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.netbar.bad{border-color:var(--danger);color:var(--danger)}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;max-width:90vw;text-align:center;animation:fade .2s}
.list{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:15px}
.stat .h{color:var(--muted);font-size:13px}
.prose p{margin:0 0 10px}
.prose h3{font-size:20px;margin:14px 0 6px}
.prose ul{margin:0 0 10px;padding-inline-start:20px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding-bottom:3px;color:#fff;text-shadow:0 1px 2px #000}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.tog{width:54px;height:32px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:inset-inline-start .15s}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tog[aria-pressed="true"]::after{inset-inline-start:25px;background:var(--accent-ink)}
.guide{display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.guide .big{font-size:56px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.screen>.wrap{max-width:620px}}
</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   NestLink 1.0 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c;
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);

<script>

let AC = null;
function snd(kind) {
  if (!ST.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type, vol, at) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t + (at || 0)); g.gain.setValueAtTime(vol || .18, t + (at || 0)); g.gain.exponentialRampToValueAtTime(.001, t + (at || 0) + d); o.connect(g).connect(AC.destination); o.start(t + (at || 0)); o.stop(t + (at || 0) + d + .02); };
    const click = (at, vol) => { const len = .03, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3); const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; g.gain.value = vol || .5; s.buffer = buf; s.connect(f).connect(g).connect(AC.destination); s.start(t + at); };
    if (kind === 'dice') { for (let i = 0; i < 6; i++) click(i * .055 + Math.random() * .02, .6); }
    else if (kind === 'move') { tone(190, .08, 'triangle', .22); click(0, .25); }
    else if (kind === 'hit') { tone(120, .16, 'square', .12); click(0, .5); }
    else if (kind === 'win') { [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', .14, i * .12)); }
    else if (kind === 'lose') { [392, 330, 262].forEach((f, i) => tone(f, .25, 'sine', .12, i * .15)); }
    else if (kind === 'ping') tone(880, .12, 'sine', .1);
  } catch (e) {}
}

function newLocalGame(kind, o) {
  if (kind === 'bg') {
    G = BGX.create({ mode: o.mode, variant: o.variant, level: o.level, match: o.match, turkish: o.turkish, names: o.mode === 'cpu' ? [ST.name || T('you'), T('computer')] : [o.p1, o.p2], me: o.mode === 'cpu' ? 0 : null });
  } else {
    const me = o.mode === 'cpu' ? (o.color === 'r' ? (Math.random() < .5 ? 0 : 1) : +o.color) : null;
    const names = o.mode === 'cpu' ? (me === 0 ? [ST.name || T('you'), T('computer')] : [T('computer'), ST.name || T('you')]) : [o.p1, o.p2];
    G = CKX.create({ mode: o.mode, level: o.level, rules: o.rules, names, me });
  }
  saveGame(); openGame();
}
function openGame() {
  if (!G) return goHome();
  if (G.mode === 'online') NET.ensure();
  if (G.mode === 'online' && G.phase === 'lobby') return showLobby();
  if (G.kind === 'bg') BGX.open(); else CKX.open();
  if (G.mode === 'online') NET.paintStatus();
}

        <div id="netbar" class="netbar hidden"></div>

        <div class="boardbox" id="board">${boardHTML || ''}</div>

        <div class="actions" id="gAct"></div>
        <div id="gDock"></div>
        <div id="gVm" class="list"></div>`;
      $('#gMenu').onclick = gameMenu;
    });
    if (G.mode === 'online') NET.renderDock();
  },
  strip(id, o) {
    const el = $('#' + id); if (!el) return;
    el.classList.toggle('turn', !!o.turn);

    $$('button', a).forEach(btn => btn.onclick = () => { const b = list[+btn.dataset.i]; if (!b.dis) b.fn(); });
  },
  emoji(seatIsTop, e) {
    const host = $('#' + (seatIsTop ? 'stripTop' : 'stripBot')); if (!host) return;
    const f = h(`<div class="floatemo" style="inset-inline-end:16px;top:-10px">${e}</div>`); host.appendChild(f); setTimeout(() => f.remove(), 1900);
  },
  svgPoint(svg, ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
};
function controllerOf(pl) { if (G.mode === 'local') return 'human'; if (G.mode === 'cpu') return pl === G.me ? 'human' : 'cpu'; return pl === G.me ? 'human' : 'remote'; }

function gameMenu() {
  const items = [];
  if (G.kind === 'bg' ? !['over', 'matchover', 'opening'].includes(G.phase) : G.phase !== 'over') {
    items.push(['🏳️ ' + T('resign'), () => confirmBox(T('resignQ'), () => (G.kind === 'bg' ? BGX : CKX).resign(), { danger: true })]);
    if (G.kind === 'ck' && G.mode !== 'cpu') items.push(['🤝 ' + T('offerDraw'), () => CKX.offerDraw()]);
  }
  items.push(['📜 ' + T('rulesBtn'), () => showRules(G.kind, true)]);
  items.push(['⚙️ ' + T('settings'), () => showSettings(true)]);
  if (G.mode === 'online') items.push(['🚪 ' + T('leave'), () => confirmBox(T('leaveQ'), () => { NET.leave(); goHome(); }, { danger: true })]);
  const s = sheet(`<h3>${T('menu')}</h3>${items.map((x, i) => `<button class="btn quiet" data-i="${i}">${x[0]}</button>`).join('')}<button class="btn" id="mX">${T('close')}</button>`);
  $$('[data-i]', s).forEach(b => b.onclick = () => { closeSheet(); items[+b.dataset.i][1](); });
  $('#mX', s).onclick = closeSheet;
}

/* =====================================================================
   Backgammon
   ===================================================================== */
const BGX = (() => {
  const BW = 400, BH = 340, PW = 164 / 6, R = 12.4, PH = 138;
  let run = 0, sel = null, targets = null, drag = null, anim = null;
  const mir = x => ST.mirror ? BW - x : x;
  const E = () => (G && G.variant === 'long') ? LN : BG;
  const isLong = () => !!(G && G.variant === 'long');
  const oppPt = p => isLong() ? LN.SH(p) : 25 - p;
  // head-rule budget left this turn (long nardy only; BG ignores it)
  const hl = () => isLong() ? (G.headLimit || 1) - G.tm.filter(x => x.from === 24).length : undefined;
  const alive = id => id === run && CUR === 'game' && G && G.kind === 'bg';
  function stopTimers() { run++; }

  function create(o) {
    return { kind: 'bg', variant: o.variant || 'short', mode: o.mode, level: o.level, match: o.match, turkish: o.turkish, names: o.names, me: o.me, score: [0, 0], gameNo: 1, hints: 0,
      phase: 'opening', s: (o.variant === 'long' ? LN : BG).newGame(), turn: 0, dice: null, rem: [], need: 0, onlyDie: null, start: null, tm: [], rec: null, result: null, open: null, net: o.net || null };
  }
  const vp = () => G.mode === 'local' ? 0 : G.me;                         // whose side is at the bottom
  const toView = (p, pl) => p === 0 || p === 25 ? p : (pl === vp() ? p : oppPt(p));   // mover-perspective point → viewer point
  const fromView = (p, pl) => p === 0 || p === 25 ? p : (pl === vp() ? p : oppPt(p));

  /* ---------- geometry ---------- */
  function ptX(i) { let x; if (i <= 6) x = 196 + (6 - i) * PW + PW / 2; else if (i <= 12) x = 8 + (12 - i) * PW + PW / 2; else if (i <= 18) x = 8 + (i - 13) * PW + PW / 2; else x = 196 + (i - 19) * PW + PW / 2; return mir(x); }
  function chkY(i, k, n) { const st = n <= 5 ? 2 * R : (PH - 2 * R) / (n - 1); return i >= 13 ? 8 + R + k * st : BH - 8 - R - k * st; }
  function barXY(viewerSide, k) { return [mir(184), viewerSide ? 214 + Math.min(k, 4) * 2 * R * .9 : 126 - Math.min(k, 4) * 2 * R * .9]; }
  function trayY(viewerSide, k) { return viewerSide ? BH - 14 - k * 8.6 : 8 + 6 + k * 8.6; }
  // where the k-th of n checkers of a viewer-region sits; region: 1..24 | 'barMe' | 'barOpp' | 'offMe' | 'offOpp'
  function slotXY(region, k, n) {
    if (region === 'barMe') return barXY(true, k); if (region === 'barOpp') return barXY(false, k);
    if (region === 'offMe') return [mir(378), trayY(true, k)]; if (region === 'offOpp') return [mir(378), trayY(false, k)];
    return [ptX(region), chkY(region, k, n)];
  }

  /* ---------- svg ---------- */
  function svg(s, o) {
    o = o || {};
    const v = o.vp != null ? o.vp : vp();
    const long = o.variant ? o.variant === 'long' : isLong(), EN = long ? LN : BG, op = i => long ? LN.SH(i) : 25 - i;
    const [a, b] = EN.persp(s, v);                                      // a = bottom player's checkers (viewer numbering), b = top player (their numbering)
    const colA = v === 0 ? 'A' : 'B', colB = v === 0 ? 'B' : 'A';
    let g = `<rect x="0" y="0" width="${BW}" height="${BH}" rx="10" fill="var(--frame)"/>
      <rect x="${Math.min(mir(8), mir(172))}" y="8" width="164" height="${BH - 16}" fill="var(--field)"/><rect x="${Math.min(mir(196), mir(360))}" y="8" width="164" height="${BH - 16}" fill="var(--field)"/>
      <rect x="${Math.min(mir(364), mir(392))}" y="8" width="28" height="${BH - 16}" rx="3" fill="var(--tray)"/>
      <rect x="${Math.min(mir(172), mir(196))}" y="8" width="24" height="${BH - 16}" fill="var(--bar)"/>
      <line x1="${mir(184)}" y1="8" x2="${mir(184)}" y2="${BH - 8}" stroke="var(--frame-hi)" stroke-width=".8" opacity=".5"/>
      <rect x="${Math.min(mir(8), mir(360))}" y="8" width="352" height="${BH - 16}" fill="none" stroke="var(--frame-hi)" stroke-width="1" opacity=".7"/>`;
    // points
    const tg = o.targets || new Set();
    for (let i = 1; i <= 24; i++) {
      const x = ptX(i), top = i >= 13, by = top ? 8 : BH - 8, ty = top ? 8 + PH : BH - 8 - PH;
      const fill = (i % 2) ? 'var(--ptA)' : 'var(--ptB)';
      g += `<polygon points="${x - PW / 2 + .6},${by} ${x + PW / 2 - .6},${by} ${x},${ty}" fill="${fill}"/>`;
      if (tg.has(i)) g += `<polygon class="tgt" points="${x - PW / 2 + .6},${by} ${x + PW / 2 - .6},${by} ${x},${ty}" fill="var(--hl)" opacity=".55"/>`;
    }
    if (o.labels) for (let i = 1; i <= 24; i++) g += `<text x="${ptX(i)}" y="${i >= 13 ? 8 + PH + 12 : BH - 8 - PH - 4}" font-size="8" text-anchor="middle" fill="var(--frame-hi)" opacity=".55">${i}</text>`;
    // last move trail
    if (o.trail) for (const [p, q] of o.trail) { if (p >= 1 && p <= 24) g += `<circle cx="${ptX(p)}" cy="${p >= 13 ? 8 + 4 : BH - 12}" r="3" fill="var(--hl2)"/>`; }
    // checkers on points
    const chk = (x, y, col, extra) => `<circle cx="${x}" cy="${y}" r="${R}" fill="var(--chk${col})" stroke="var(--chk${col}-rim)" stroke-width="2" ${extra || ''}/><circle cx="${x}" cy="${y}" r="${R * .55}" fill="none" stroke="var(--chk${col}-rim)" stroke-width="1" opacity=".55" pointer-events="none"/>`;
    const cnt = (x, y, n, col) => `<text x="${x}" y="${y + 4}" font-size="12" font-weight="700" text-anchor="middle" fill="var(--chk${col}-ink)" pointer-events="none">${n}</text>`;
    const selV = o.sel, mv = o.movable || new Set();
    for (let i = 1; i <= 24; i++) {
      let n = a[i], col = colA; if (!n) { n = b[op(i)]; col = colB; }
      if (!n) continue;
      for (let k = 0; k < n; k++) {
        const [x, y] = slotXY(i, k, n);
        g += chk(x, y, col, `data-r="${i}" data-k="${k}"`);
        if (k === n - 1) {
          if (selV === i) g += `<circle cx="${x}" cy="${y}" r="${R + 3}" fill="none" stroke="var(--hl)" stroke-width="3"/>`;
          else if (mv.has(i)) g += `<circle cx="${x}" cy="${y}" r="3.2" fill="var(--hl)"/>`;
          if (n > 5) g += cnt(x, y, n, col);
        }
      }
    }
    // bar
    const bars = [['barMe', a[25], colA], ['barOpp', b[25], colB]];
    for (const [reg, n, col] of bars) {
      for (let k = 0; k < Math.min(n, 5); k++) { const [x, y] = slotXY(reg, k); g += chk(x, y, col, `data-r="${reg}" data-k="${k}"`); }
      if (n > 1) { const [x, y] = slotXY(reg, Math.min(n, 5) - 1); g += cnt(x, y, n, col); }
      if (n && ((reg === 'barMe' && selV === 25 && o.selSide === 'me') || (reg === 'barOpp' && selV === 25 && o.selSide === 'opp'))) { const [x, y] = slotXY(reg, Math.min(n, 5) - 1); g += `<circle cx="${x}" cy="${y}" r="${R + 3}" fill="none" stroke="var(--hl)" stroke-width="3"/>`; }
      else if (n && mv.has(reg === 'barMe' ? 'barMe' : 'barOpp')) { const [x, y] = slotXY(reg, Math.min(n, 5) - 1); g += `<circle cx="${x}" cy="${y}" r="3.2" fill="var(--hl)"/>`; }
    }
    // borne off
    for (const [reg, n, col] of [['offMe', a[0], colA], ['offOpp', b[0], colB]]) {
      for (let k = 0; k < n; k++) { const [x, y] = slotXY(reg, k); g += `<rect x="${x - 11}" y="${y - 3.4}" width="22" height="6.8" rx="2" fill="var(--chk${col})" stroke="var(--chk${col}-rim)" stroke-width="1" data-r="${reg}" data-k="${k}"/>`; }
    }
    if (o.trayTarget) g += `<rect class="tgt" x="${Math.min(mir(364), mir(392))}" y="${o.trayTarget === 'me' ? BH / 2 : 8}" width="28" height="${BH / 2 - 8}" rx="3" fill="var(--hl)" opacity=".5"/>`;
    // dice
    if (o.dice) g += diceSVG(o.dice, o.rem, o.diceSide, o.shake);
    if (o.overlay) g += o.overlay;
    return `<svg viewBox="0 0 ${BW} ${BH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(T('bg'))}">${g}</svg>`;
  }
  function dieFace(x, y, s, v, faded, rot) {
    const P = { 1: [[.5, .5]], 2: [[.25, .25], [.75, .75]], 3: [[.25, .25], [.5, .5], [.75, .75]], 4: [[.25, .25], [.75, .25], [.25, .75], [.75, .75]], 5: [[.25, .25], [.75, .25], [.5, .5], [.25, .75], [.75, .75]], 6: [[.25, .22], [.75, .22], [.25, .5], [.75, .5], [.25, .78], [.75, .78]] };
    return `<g transform="translate(${x} ${y}) rotate(${rot || 0})" opacity="${faded ? .35 : 1}"><rect x="${-s / 2}" y="${-s / 2}" width="${s}" height="${s}" rx="${s * .18}" fill="var(--die)" stroke="rgba(0,0,0,.35)" stroke-width="1"/>${(P[v] || []).map(([px, py]) => `<circle cx="${-s / 2 + px * s}" cy="${-s / 2 + py * s}" r="${s * .09}" fill="var(--die-pip)"/>`).join('')}</g>`;
  }
  function diceSVG(d, rem, side, shake) {
    const cx = side === 'me' ? 278 : side === 'opp' ? 90 : 184, y = BH / 2;
    const dbl = d[0] === d[1] && !shake && side !== 'open';
    if (side === 'open') return dieFace(mir(90), y, 28, d[1], false, shake ? -14 : -6) + dieFace(mir(278), y, 28, d[0], false, shake ? 12 : 5);
    if (dbl) {
      const left = rem ? rem.length : 4; let g = '';
      for (let k = 0; k < 4; k++) g += dieFace(mir(cx - 39 + k * 26), y, 22, d[0], k >= left, (k % 2 ? 4 : -4));
      return g;
    }
    const used = v => rem && !rem.includes(v);
    const r = rem ? rem.slice() : [d[0], d[1]];
    const f0 = rem ? !r.includes(d[0]) : false; if (rem && !f0) r.splice(r.indexOf(d[0]), 1);
    const f1 = rem ? !r.includes(d[1]) : false;
    return dieFace(mir(cx - 18), y, 28, d[0], f0, shake ? -18 : -5) + dieFace(mir(cx + 18), y, 28, d[1], f1, shake ? 16 : 6);
  }

  /* ---------- render ---------- */
  function render(opt) {
    opt = opt || {};
    const box = $('#board'); if (!box || !G) return;
    const pl = G.turn, human = controllerOf(pl) === 'human';
    const o = { vp: vp(), dice: G.dice, rem: G.rem, diceSide: G.phase === 'opening' ? 'open' : (pl === vp() ? 'me' : 'opp'), shake: opt.shake, labels: false };
    if (G.phase === 'opening' && G.open) o.dice = G.open;
    if (G.phase === 'opening' && !G.open) o.dice = null;
    if (G.phase === 'roll') o.dice = null;
    if (human && (G.phase === 'move')) {
      const steps = E().legalSteps(G.s, pl, G.rem, G.need - G.tm.length, G.onlyDie, hl());
      o.movable = new Set(steps.map(x => x.from === 25 ? (pl === vp() ? 'barMe' : 'barOpp') : toView(x.from, pl)));
      if (sel != null) {
        o.sel = sel === 25 ? 25 : toView(sel, pl); o.selSide = pl === vp() ? 'me' : 'opp';
        o.targets = new Set(); for (const t of targets.keys()) { if (t === 0) o.trayTarget = pl === vp() ? 'me' : 'opp'; else o.targets.add(toView(t, pl)); }
      }
    }
    if (G.lastTrail && G.phase !== 'move') o.trail = G.lastTrail;
    box.innerHTML = svg(G.s, o);
    strips(); actions(); message();
    if (opt.anim) animate(opt.anim);
  }
  function strips() {
    const v = vp(), s = G.s, online = G.mode === 'online';
    const col = p => p === 0 ? ['--chkA', '--chkA-rim'] : ['--chkB', '--chkB-rim'];
    for (const [id, p] of [['stripBot', v], ['stripTop', 1 - v]]) {
      const [a] = E().persp(s, p), c = col(p);
      const ro = online ? NET.rosterFor(p) : null;
      GS.strip(id, { name: G.names[p], color: c[0], rim: c[1], turn: G.turn === p && !['over', 'matchover', 'opening'].includes(G.phase), meta: ST.pips ? T('pip', { n: N(E().pip(a)) }) : '', score: G.match > 1 ? G.score[p] : null,
        net: ro && p !== G.me ? ro.online : null, talk: ro && ro.talking });
    }
  }
  function message() {
    const pl = G.turn, ctl = controllerOf(pl), nm = G.names[pl];
    let t = '';
    if (G.phase === 'opening') t = G.openMsg || T('opening');
    else if (G.phase === 'roll') t = ctl === 'human' ? (G.mode === 'local' ? T('turnOf', { n: esc(nm) }) + ' · ' : '') + T('tapRoll') : ctl === 'cpu' ? T('thinking', { n: esc(nm) }) : T('turnOf', { n: esc(nm) });
    else if (G.phase === 'move') {
      if (G.need === 0) t = T('noMoves');
      else if (ctl === 'human') { const left = G.need - G.tm.length; t = (G.mode === 'local' ? esc(nm) + ' · ' : '') + (sel == null ? T('pickChecker') + ' · ' : '') + (left === 1 ? T('moveLeft1') : T('moveLeft', { n: N(left) })); }
      else t = ctl === 'cpu' ? T('thinking', { n: esc(nm) }) : T('turnOf', { n: esc(nm) });
    } else if (G.phase === 'confirm') t = ctl === 'human' ? T('confirmTurn') : T('turnOf', { n: esc(nm) });
    else if (G.phase === 'over' || G.phase === 'matchover') t = resultLine();
    GS.msg(t);
  }
  function resultLine() {
    if (!G.result) return '';
    const w = G.result.w, ty = G.result.type, mine = G.mode !== 'local' && w === G.me;
    const head = G.mode === 'local' ? T('win', { n: esc(G.names[w]) }) : mine ? T('youWin') : (G.mode === 'cpu' ? T('youLose') : T('win', { n: esc(G.names[w]) }));
    return `${head} ${ty === 3 ? T('tmars') : ty === 2 ? T('mars') : ''}`;
  }
  function actions() {
    const pl = G.turn, human = controllerOf(pl) === 'human', list = [];
    if (G.phase === 'roll' && human) list.push({ label: '🎲 ' + T('roll'), cls: 'primary', fn: humanRoll });
    if ((G.phase === 'move' || G.phase === 'confirm') && human && G.need > 0) {
      list.push({ label: '↶ ' + T('undo'), dis: !G.tm.length, fn: undo });
      if (G.phase === 'confirm') list.push({ label: '✓ ' + T('done'), cls: 'primary', fn: commitHuman });
      else list.push({ label: '💡 ' + T('hint'), fn: hint });
    }
    if (G.phase === 'over') list.push({ label: T('nextGame'), cls: 'primary', fn: nextGame });
    if (G.phase === 'matchover') { list.push({ label: G.mode === 'online' ? T('rematch') : G.match > 1 ? T('newMatch') : T('newGame'), cls: 'primary', fn: newMatch }); list.push({ label: T('home'), fn: goHome }); }
    GS.actions(list);
  }

  /* ---------- animation (FLIP: draw the end state, slide the checker in from where it was) ---------- */
  function animate(list) {
    if (reduced()) return;
    const svgEl = $('#board svg'); if (!svgEl) return;
    for (const a of list) {
      const nodes = $$(`[data-r="${a.toReg}"]`, svgEl); const node = nodes.filter(n => n.tagName === 'circle' || n.tagName === 'rect').pop();
      if (!node) continue;
      const tx = +(node.getAttribute('cx') || (+node.getAttribute('x') + 11)), ty = +(node.getAttribute('cy') || (+node.getAttribute('y') + 3.4));
      const dx = a.fx - tx, dy = a.fy - ty;
      try { node.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'translate(0,0)' }], { duration: 300 * speedMul(), easing: 'cubic-bezier(.3,.7,.3,1)' }); } catch (e) {}
    }
  }
  // positions before a step (viewer regions)
  function regionOf(p, pl, isFrom) {
    const mine = pl === vp();
    if (p === 25) return mine ? 'barMe' : 'barOpp';
    if (p === 0) return mine ? 'offMe' : 'offOpp';
    return toView(p, pl);
  }
  function countIn(s, reg) {
    const [a, b] = E().persp(s, vp());
    if (reg === 'barMe') return a[25]; if (reg === 'barOpp') return b[25]; if (reg === 'offMe') return a[0]; if (reg === 'offOpp') return b[0];
    return a[reg] || b[oppPt(reg)];
  }
  function stepAnim(before, pl, st) {
    const fr = regionOf(st.from, pl), to = regionOf(st.to, pl);
    const n = countIn(before, fr); const [fx, fy] = slotXY(fr, n - 1, n);
    const out = [{ toReg: to, fx, fy }];
    if (st.hit) { const [hx, hy] = slotXY(to, 0, 1); out.push({ toReg: pl === vp() ? 'barOpp' : 'barMe', fx: hx, fy: hy }); }
    return out;
  }

  /* ---------- flow ---------- */
  function open() {
    sel = null; targets = null; run++;
    GS.open(T(isLong() ? 'bgLong' : 'bg') + (G.mode === 'cpu' ? ' · ' + T(G.level) : ''), '');
    bindBoard(); render(); proceed();
  }
  function proceed() {
    const id = run, pl = G.turn, ctl = controllerOf(pl);
    if (G.phase === 'opening') { if (G.mode !== 'online' || NET.isHost()) doOpening(id); return; }
    if (G.phase === 'roll') { if (ctl === 'cpu') cpuTurn(id); else if (ctl === 'human' && ST.autoRoll) setTimeout(() => { if (alive(id) && G.phase === 'roll') humanRoll(); }, 450); return; }

function backup() {
  const data = { app: 'TavlaNest', version: APP_VERSION, date: new Date().toISOString(), user: ST.name, settings: ST, stats: STATS, replays: store.get(K.rep, []), game: G && G.mode !== 'online' ? G : null };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `TavlaNest-${(ST.name || 'backup').replace(/[^\w\u0590-\u05FF-]+/g, '_')}-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { return toast(T('badFile')); }
    if (!d || d.app !== 'TavlaNest') return toast(T('badFile'));
    confirmBox(T('restoreQ'), () => {
      ST = Object.assign({}, DEF_SET, d.settings || {}); saveSet();
      if (d.stats) { STATS = d.stats; saveStats(); }
      store.set(K.rep, d.replays || []);
      leaveOnlineQuiet(); G = d.game || null; saveGame();
      applyLook(); toast(T('restored')); goHome();
    }, { danger: true });
  };
  r.readAsText(file);
}

function showGuide(first) {
  const steps = [['🎲', 'g1t', 'g1'], ['🤖', 'g2t', 'g2'], ['👆', 'g3t', 'g3'], ['🎙', 'g4t', 'g4'], ['💾', 'g5t', 'g5']];
  let i = 0;
  const paint = () => {
    const [ic, t, b] = steps[i];
    const s = sheet(`<div class="guide"><div class="big">${ic}</div><h3>${T(t)}</h3><p style="margin:0">${T(b)}</p><div class="dots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row" style="width:100%"><button class="btn quiet grow" id="gSkip">${T('skip')}</button><button class="btn primary grow" id="gNext">${i === steps.length - 1 ? T('letsPlay') : T('next')}</button></div></div>`, done);
    $('#gSkip', s).onclick = () => { closeSheet(); done(); };
    $('#gNext', s).onclick = () => { if (i < steps.length - 1) { i++; paint(); } else { closeSheet(); done(); } };
  };
  const done = () => { if (!ST.onboarded) { ST.onboarded = true; saveSet(); } };
  paint();
}

  show('replays', w => {
    w.innerHTML = `${topbar(T('replays'))}
      ${list.length ? `<div class="list">${list.map((r, i) => { const res = r.result ? (r.result.w === 2 ? T('draw') : esc(r.names[r.result.w]) + ' 🏆') : ''; return `<button class="card resume" data-i="${i}"><span style="font-size:26px">${r.kind === 'bg' ? '🎲' : '⛀'}</span><span class="grow" style="text-align:start"><b>${esc(r.names[0])} – ${esc(r.names[1])}</b><span class="muted small">${T(r.kind === 'bg' && r.variant === 'long' ? 'bgLong' : r.kind)} · ${N(new Date(r.date).toLocaleDateString())} · ${res}</span></span></button>`; }).join('')}</div>` : `<div class="card muted">${T('noReplays')}</div>`}`;
    $$('[data-i]', w).forEach(b => b.onclick = () => replayView(list[+b.dataset.i]));
  });
}
function replayView(r) {
  // rebuild every position from the start + move list
  const frames = [];
  if (r.kind === 'bg') {
    const EN = r.variant === 'long' ? LN : BG;
    let s = EN.newGame(); frames.push({ s, d: r.open, side: 'open' });
    for (const t of r.turns || []) { let x = s; for (const [from, die] of t.m) { const q = EN.uiStep(x, t.p, from, die); if (!q) break; x = q.state; } s = x; frames.push({ s, d: t.d, side: t.p }); }
  } else {
    let st = CK.newGame(); frames.push({ b: st.b });
    for (const p of r.moves || []) { const mv = CK.moves(st.b, st.turn, r.rules).find(m => m.path.length === p.length && m.path.every((q, i) => q === p[i])); if (!mv) break; st = CK.play(st, mv, r.rules); frames.push({ b: st.b, last: { path: p } }); }
  }
  let i = 0, timer = null;
  show('replay', w => {
    w.innerHTML = `${topbar(T('replayOf', { g: T(r.kind === 'bg' && r.variant === 'long' ? 'bgLong' : r.kind) }))}<div class="muted" style="text-align:center">${esc(r.names[0])} – ${esc(r.names[1])}</div><div class="boardbox" id="rpB"></div>
      <div class="msg" id="rpM"></div><div class="actions"><button class="btn quiet" id="rp0">⏮</button><button class="btn quiet" id="rpP">${isRTL() ? '▶' : '◀'}</button><button class="btn primary" id="rpA">⏯</button><button class="btn quiet" id="rpN">${isRTL() ? '◀' : '▶'}</button><button class="btn quiet" id="rpE">⏭</button></div>`;
    const paint = () => {
      const f = frames[i];
      if (r.kind === 'bg') {
        const vpp = r.mode === 'local' || r.me == null ? 0 : r.me;
        $('#rpB').innerHTML = BGX.svg(f.s, { vp: vpp, variant: r.variant || 'short', dice: f.d, diceSide: f.side === 'open' ? 'open' : (f.side === vpp ? 'me' : 'opp') });
      } else $('#rpB').innerHTML = CKX.svg(f.b, { flip: r.me === 1, last: f.last });
      const endTxt = !r.result ? '' : r.result.w === 2 ? T('draw') : (r.mode !== 'local' && r.me != null) ? (r.result.w === r.me ? T('youWin') : r.mode === 'cpu' ? T('youLose') : T('win', { n: esc(r.names[r.result.w]) })) : T('win', { n: esc(r.names[r.result.w]) });
      $('#rpM').innerHTML = `${N(i + ' / ' + (frames.length - 1))}${i === frames.length - 1 && endTxt ? ' · ' + endTxt : ''}`;
    };
    const go = k => { i = Math.max(0, Math.min(frames.length - 1, k)); paint(); };
    $('#rp0').onclick = () => go(0); $('#rpE').onclick = () => go(frames.length - 1);
    $('#rpP').onclick = () => go(i - 1); $('#rpN').onclick = () => go(i + 1);
    $('#rpA').onclick = () => { if (timer) { clearInterval(timer); timer = null; return; } timer = setInterval(() => { if (CUR !== 'replay' || i >= frames.length - 1) { clearInterval(timer); timer = null; return; } go(i + 1); }, 900 * speedMul()); };
    paint();
  });
}

/* ---------- init ---------- */
(function init() {
  applyLook();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // old/broken saved games are dropped gently instead of crashing the app
  if (G && (!G.kind && G.phase !== 'lobby' || G.mode === 'online' && G.phase !== 'lobby' && !(G.net && G.net.sess))) { G = null; saveGame(); }
  const q = new URLSearchParams(location.search), jc = q.get('join');
  goHome();
  if (G && G.mode === 'online') openGame();
  if (jc) {
    history.replaceState(null, '', location.pathname + (q.get('peerhost') ? `?peerhost=${q.get('peerhost')}&peerport=${q.get('peerport') || 9000}` : ''));
    needName(() => joinSheet(jc.toUpperCase().slice(0, 5)));
  } else if (!ST.onboarded) showGuide(true);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();


</script>
